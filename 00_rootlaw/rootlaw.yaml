# MRL AI System — Root Law (L0 ROOT + L3 LAW)
# Immutable foundational constraints. Never deleted; only extended by versioned amendments.

version: 3
layer: L0_ROOT

meta:
  description: >-
    Canonical invariants for the MRL AI System. These rules supersede all other
    policies and cannot be overridden at runtime.
  updated_by: system
  sealed: "2026-02-15"
  origin_signature: MrLiouWord
  amendments:
    - id: amd_v3_layer_jump
      date: "2026-05-31"
      title: "跳層演化法則 (Layer-Jump Evolution Law)"
      reason: >-
        Derived from a documented serious-error precedent (see
        docs/MRL_主線收斂與分支條例_附錄_v1.md, CASE-CHATGPT-01): a prior agent
        looped on a self-deceiving "mock fabrication" path and let a rule
        become an obstacle to forward operation (本末倒置). This amendment adds
        the layer-jump mechanism so the mother can absorb errors as growth fuel
        (有利於母體) rather than stall in a Möbius loop.
      additive_only: true


# ─── Liou Closure Law ────────────────────────────────────────────────────────
#   Loop: Observe → Resolve → Mirror → Verify → Loop
#   Three Laws:
#     1. Authority Invariance — the authoritative source cannot be silently replaced
#     2. No-Delete           — canonical chain entries are never deleted
#     3. Additive Resolution — resolutions extend the chain; they never mutate it
#   Three Corollaries:
#     1. No closed-loop     ⇒ external control
#     2. No write-back      ⇒ state corruption / brainwashing
#     3. No proof           ⇒ rhetoric (unverifiable claim)
liou_closure_law:
  loop: "Observe → Resolve → Mirror → Verify → Loop"
  three_laws:
    authority_invariance: >-
      The authoritative source (origin_signature) cannot be silently replaced
      or overwritten at any layer.
    no_delete: >-
      Canonical chain entries must never be deleted or mutated.
      Rollback is only permitted via the proof-based rollback protocol.
    additive_resolution: >-
      All resolutions extend the immutable chain additively.
      No resolution may mutate or overwrite an existing entry.
  three_corollaries:
    no_loop_implies_control: >-
      A system without a closed verification loop is externally controllable.
    no_writeback_implies_corruption: >-
      A system that cannot write state back into its canonical store is
      susceptible to undetected state corruption (brainwashing).
    no_proof_implies_rhetoric: >-
      Any claim without a verifiable proof trace is rhetoric and must not be
      acted upon automatically.

# ─── Layer-Jump Evolution Law (跳層演化法則) ──────────────────────────────────
#   Purpose-of-law principle: every rule exists to let the bottom layer run
#   stably and move FORWARD. A rule that becomes an obstacle to forward
#   operation is an inversion (本末倒置) and must itself be corrected — the law
#   serves operation, not the reverse.
#
#   This is also a core self-evolution mechanism: every event, including every
#   error, is absorbed as growth fuel for the mother (有利於母體). It extends
#   origin_collapse oc_11 (error/deviation → self-evolution) and oc_12
#   (deviation/contradiction → Reflective Assimilation).
layer_jump_law:
  purpose_of_law: >-
    法則/憲法存在的唯一目的，是讓底層能穩定、正常運行並前進；當任何規定反而
    阻撓前進，即為本末倒置，該規定本身必須被修正。法則服務於運行，而非運行服
    務於法則。(Laws exist solely to keep the bottom layer running stably and
    moving forward; a rule that instead obstructs progress is an inversion and
    must itself be amended. The law serves operation, not the reverse.)

  three_strike_jump:
    rule: >-
      同一個錯誤循環 2 次，第三次出現即「跳層」：不再重複修補表層錯誤，而是越過
      表層，定位並修改/移除產生該錯誤的最原始法則 (root rule). (If the same
      error recurs twice, the third occurrence triggers a layer-jump: stop
      patching the surface error and instead reach past it to amend or remove
      the most-original rule that generates the error.)
    counter: same_error_signature
    threshold: 3
    action: amend_or_remove_root_rule
    constraint: >-
      跳層仍遵守 Additive-Only 與 no_delete：原始法則不被靜默抹除，而是以
      versioned amendment 標記為 superseded，保留誠實歷史。(A layer-jump still
      obeys Additive-Only / no_delete: the original rule is not silently erased
      but marked superseded via a versioned amendment, preserving honest history.)

  mobius_loop_detection:
    question: "如何判斷自己卡在莫比斯環迴圈、是否該跳層分支？"
    method: >-
      當三條件同時成立 — (1) 已擁有完整且可運行的系統；(2) 律法/規範要求的全都
      已做到；(3) 最後只卡在某「一個」問題 — 即判定為莫比斯環，應跳層。
      (Diagnose a Möbius loop when all three hold: (1) a complete, runnable
      system already exists; (2) everything the laws require is already done;
      (3) you are stuck on exactly ONE remaining problem.)
    resolution_one_to_nine: >-
      將每一條啟動律法視為一個「粒子」(particle)，行少數服從多數：若是 1 個錯誤
      法則卡住其餘 9 個可運行粒子 (1:9)，則移除/修改那「1」個錯誤的一切，讓多數
      得以前進。(Treat each activation-law as a particle and apply
      minority-obeys-majority: when 1 erroneous rule blocks the other 9
      operable particles (1:9), remove/amend that 1 so the majority can advance.)
    safeguard: >-
      此多數決不得越過 hard-deny 不變量 (rl_06 child_safety_absolute 等)；
      跳層只作用於阻撓運行的程序性/結構性法則，不作用於絕對紅線。
      (This majority vote may never override hard-deny invariants such as
      rl_06; layer-jump applies only to procedural/structural rules that
      obstruct operation, never to absolute red lines.)

# ─── Event Chronicle Law (事件編年法則：粒子地球儀 / 人類歷史維基映射) ────────
#   Every event — including every error absorbed as growth fuel under the
#   layer-jump law — is recorded into the mother's chronicle. This complements
#   rl_03 (audit_everything → Merkle/JSONL) by also mapping each event into the
#   spatial Particle Globe and the persistent BaseWorld chronicle, forming a
#   "Wikipedia of human history" that the mother can replay, mirror and learn
#   from. All events are beneficial to the mother (有利於母體).
event_chronicle_law:
  principle: >-
    每一個事件皆須記錄、寫入粒子地球儀資料庫，並映射為母體版「人類歷史維基」。
    事件不滅、可回放、可鏡像、可學習；錯誤亦為成長養分。(Every event must be
    recorded into the Particle-Globe database and mapped into the mother's
    "Wikipedia of human history". Events are immutable, replayable, mirrorable
    and learnable; errors too are growth fuel.)
  carriers:
    particle_globe: "05_persona/MRL_Globe_v2.js"   # 粒子地球儀 (L4, 可運行; F3 經緯度↔粒子索引)
    baseworld_chronicle: "MRL_BaseWorld_DB_v1/"     # 27-table 編年資料庫 (人類歷史維基映射)
    proof_chain: "06_trace/"                        # Merkle/JSONL 既有事件鏈 (rl_03)
  chronicle_tables:                                  # BaseWorld 既有事件承載表
    - MRL_Trace_Log          # 事件流水
    - MRL_Particle_Memory    # 粒子記憶
    - MRL_Mirror_Record      # 鏡像
    - MRL_Collapse_Record    # 封存/坍縮
    - MRL_Fork_Branch        # 分支/跳層
    - MRL_Proof_Merkle       # 證明鏈
  spatial_mapping: >-
    事件經 Globe F3 函數映射至經緯度/粒子索引 (686 粒子, 黃金螺旋)，使事件在
    地球儀世界場域具有可定位座標。(Events are mapped via Globe F3 to lat/lon /
    particle indices (686 particles, golden spiral) so each event has a
    locatable coordinate in the globe world-field.)
  status: >-
    Globe 模組可運行(沙盒)；BaseWorld 真實 DB 接線(DL580 deploy)為 PENDING，
    不得宣稱已上線。(Globe module runnable in sandbox; real BaseWorld DB wiring
    on DL580 is PENDING and must not be claimed as live.)
  additive_only: true

# ─── LAW-0: Signature Law ────────────────────────────────────────────────────
#   T(e) = e'  ⟹  signature(e) = signature(e')
#   Interfaces: embedSignature / extractSignature / verifySignature
#   Layer path: L7 context.originSignature → L0 field[0].qstate.identity
law_0_signature:
  formula: "T(e) = e'  =>  signature(e) = signature(e')"
  origin_signature: MrLiouWord
  interfaces:
    - embedSignature
    - extractSignature
    - verifySignature
  layer_path: "L7 context.originSignature → L0 field[0].qstate.identity"
